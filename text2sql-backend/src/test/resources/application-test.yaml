# Test profile: replaces the MySQL application database with in-memory H2 (MODE=MySQL) over R2DBC, so
# the suite runs without an external server. Activated for all tests via the maven-surefire `test`
# profile.
spring:
  r2dbc:
    url: "r2dbc:h2:mem:///appdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE"
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/app-schema.sql
