# nginx config for the Text2SQL frontend.
#
# Serves the built SPA and proxies /api to the backend container, so the browser only ever talks to
# this one origin. That means no CORS, and no server address baked into the JS bundle.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Knowledge-document ingest posts the document body as JSON; nginx's 1m default would reject
    # anything larger with a 413 that never reaches the backend.
    client_max_body_size 10m;

    # Hashed build assets can be cached hard; index.html must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: unknown paths fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API, including the SSE streams (/api/text2sql/stream, /api/text2sql/agent/stream).
    # The trailing slash on the location and the absence of a URI on proxy_pass keep the full
    # /api/... path intact.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Server-Sent Events: responses never end on their own, so buffering and the default
        # 60s read timeout would break them.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
